<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Single Card</title>
<style>
  @font-face {
    font-family: 'Plus Jakarta Sans';
    font-weight: 400 800;
    src: url('{{FONT_URL_PREFIX}}/plus-jakarta-sans.woff2') format('woff2');
  }

  :root {
    --bg-cover: #E7EFEA;
    --bg-glow: #DBF0E2;
    --text-primary: #11221A;
    --text-muted: #5E7369;
    --accent-green: #12A15C;
    --accent-green-strong: #0A703F;
    --line: #D7EADD;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1080px;
    height: 1080px;
  }

  body {
    font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
    background: var(--bg-cover);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .glow {
    position: absolute;
    right: -220px;
    bottom: -220px;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle at center, var(--bg-glow) 0%, rgba(219,240,226,0) 70%);
    pointer-events: none;
  }

  .dash {
    position: absolute;
    top: 80px;
    right: 90px;
    width: 88px;
    height: 3px;
    background: var(--text-primary);
  }

  .content {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 90px;
  }

  .eyebrow {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent-green-strong);
    text-transform: uppercase;
    margin-bottom: 22px;
  }

  h1 {
    font-size: 50px;
    font-weight: 800;
    line-height: 1.2;
    color: var(--text-primary);
    max-width: 880px;
    margin-bottom: 30px;
  }

  p.body-text {
    font-size: 26px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text-primary);
    max-width: 860px;
    margin-bottom: 20px;
  }

  /* ---------- Footer: single contact line ---------- */

  .footer {
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    padding: 0 90px 56px 90px;
  }

  .footer .divider {
    height: 1px;
    background: var(--line);
    margin-bottom: 20px;
  }

  .footer .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .footer .photo {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #FFFFFF;
    box-shadow: 0 3px 10px rgba(17,34,26,0.18);
    flex: 0 0 auto;
  }

  .footer .icons {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 6px;
  }

  .footer .icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-green);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .footer .icon svg {
    width: 18px;
    height: 18px;
    fill: #FFFFFF;
  }

  .footer .handle {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent-green-strong);
    margin-left: 8px;
    white-space: nowrap;
  }

  .footer .sep {
    color: var(--text-muted);
    margin: 0 10px;
    font-size: 20px;
  }

  .footer .company-logo {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    object-fit: contain;
    background: #FFFFFF;
    border: 1px solid var(--line);
    padding: 3px;
    flex: 0 0 auto;
    margin-right: 10px;
  }

  .footer .designation {
    font-size: 19px;
    font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="dash"></div>

  <div class="content">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{HEADLINE}}</h1>
    {{BODY_PARAGRAPHS}}
  </div>

  <div class="footer">
    <div class="divider"></div>
    <div class="row">
      <img class="photo" src="{{PHOTO_SRC}}" alt="{{AUTHOR_NAME}}" />
      <div class="icons">
        <span class="icon" title="Facebook">
          <svg viewBox="0 0 24 24"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.25-1.5 1.55-1.5H16.7V3.7c-.28-.04-1.24-.12-2.36-.12-2.34 0-3.94 1.43-3.94 4.04V9.9H8v3.1h2.4v8h3.1z"/></svg>
        </span>
        <span class="icon" title="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 00-7.6 13.8L3 21l4.3-1.4A9 9 0 1012 3zm0 1.8a7.2 7.2 0 016.1 11.1l-.2.4.7 2.4-2.5-.7-.4.2A7.2 7.2 0 1112 4.8zm-3.2 3.6c-.2 0-.5 0-.7.3-.2.3-.9.8-.9 2s.9 2.3 1 2.5c.1.1 1.7 2.7 4.1 3.7 2 .8 2.4.7 2.9.6.4-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.3-.2-.6-.3-.3-.2-1.7-.9-2-1-.3-.1-.5-.1-.6.1-.2.3-.7.9-.8 1.1-.2.2-.3.2-.5.1-.3-.1-1.2-.4-2.2-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.5.1-.6l.4-.5c.1-.1.1-.3.2-.4.1-.2 0-.4 0-.5-.1-.1-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4z"/></svg>
        </span>
        <span class="icon" title="Gmail">
          <svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 014.5 5h15A1.5 1.5 0 0121 6.5v11a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 17.5v-11zm2 .3v.4l7 4.9 7-4.9v-.4l-7 4.4-7-4.4z"/></svg>
        </span>
        <span class="icon" title="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M6.94 8.5H4.5V19h2.44V8.5zM5.72 4.5a1.42 1.42 0 100 2.84 1.42 1.42 0 000-2.84zM19.5 19h-2.44v-5.4c0-1.29-.03-2.94-1.8-2.94-1.8 0-2.08 1.4-2.08 2.85V19h-2.44V8.5h2.34v1.43h.03c.33-.62 1.12-1.28 2.31-1.28 2.47 0 2.93 1.63 2.93 3.74V19z"/></svg>
        </span>
      </div>
      <div class="handle">{{HANDLE}}</div>
      <div class="sep">&middot;</div>
      <img class="company-logo" src="{{COMPANY_LOGO_SRC}}" alt="Company logo" />
      <div class="designation">{{DESIGNATION}}</div>
    </div>
  </div>
</body>
</html>
