name: Deploy ContentPro App to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy App
    runs-on: ubuntu-latest

    # Needed so the version-bump commit can be pushed back to main.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so version-bump can inspect the commit range

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # Bump app/src/version.json based on this push's commit types, BEFORE the
      # build reads it. The commit-back happens after a successful deploy (last
      # step) so the version only advances on success.
      - name: Compute version bump
        id: bump
        continue-on-error: true   # a bump hiccup must never block a deploy
        working-directory: .
        env:
          BUMP_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: node scripts/version-bump.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Ensure main is production branch
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/contentpro" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}')
          echo "Cloudflare API response status: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ]
        working-directory: .

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name contentpro --branch main

      # Persist the bumped version back to main. Pushed with the default
      # GITHUB_TOKEN, which by design does NOT trigger a new workflow run, so
      # this can never cause a deploy loop. `[skip ci]` is belt-and-suspenders.
      - name: Commit & push version bump
        if: steps.bump.outputs.bumped == 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/version.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main
