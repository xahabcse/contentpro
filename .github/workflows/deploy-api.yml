name: Deploy ContentPro API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Typecheck & Deploy to Workers
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs before deploy so a broken build never ships. No continue-on-error
      # here — a failing typecheck stops the job, and the deploy step below
      # never runs.
      - name: Typecheck
        run: npx tsc --noEmit

      # The database is Cloudflare D1 (docs/contentpro-spec.md §2/§3). Schema
      # migrations (api/migrations/*.sql) are applied manually via
      # `wrangler d1 migrations apply contentpro-db --remote` — deliberately
      # NOT automated in this workflow, so a schema change never lands
      # against the live database as a side effect of a code push. Run that
      # command by hand (with confirmation, per release-engineer's
      # guardrails) as its own step, separate from this deploy.
      #
      # IMPORTANT — first-time deploy only: the RateLimitDO Durable Object
      # (docs/contentpro-spec.md §4.2) must already have its [[migrations]]
      # block (originally new_sqlite_classes = ["MongoConnectionDO"], later
      # renamed to RateLimitDO via renamed_classes) committed in
      # api/wrangler.toml *before* this workflow ever runs against it.
      # Cloudflare registers a new/renamed Durable Object class only through
      # that migrations block on deploy; if it's missing, this deploy step
      # will fail outright. Likewise, the D1 database itself
      # (`contentpro-db`) and its `database_id` in wrangler.toml must already
      # be provisioned (`wrangler d1 create`) before this workflow can deploy
      # successfully against it. Both are one-time, manual prerequisites in
      # the committed config — this workflow cannot add them for you.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy --minify
