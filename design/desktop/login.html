<!doctype html>
<html lang="en" data-view="desktop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Cardstock · desktop</title>
  <link rel="icon" href="../_shared/favicon.svg" type="image/svg+xml">
  <script src="../_shared/ui.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../_shared/tokens.css">
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <div class="auth">
    <aside class="auth__art glass">
      <a class="logo" href="landing.html"><span class="logo__mark"></span>Cardstock</a>
      <div class="auth__fan" aria-hidden="true">
        <div class="cp" data-card="wish" data-pal="paper"></div>
        <div class="cp" data-card="cover" data-pal="ink"></div>
        <div class="cp" data-card="stat" data-pal="cobalt"></div>
      </div>
      <figure class="auth__quote surface">
        <p>Pick a template. Write the words. Export a card your feed will stop for.</p>
        <footer><span class="avatar">MS</span><span><b>Your signature is ready</b>Name, role and photo added to every slide</span></footer>
      </figure>
    </aside>

    <section class="auth__side">
      <div class="auth__switch">
        <div class="skyswitch glass" role="group" aria-label="Sky">
          <button type="button" data-sky-set="day" aria-label="Day"><i data-i="sun"></i></button>
          <button type="button" data-sky-set="night" aria-label="Night"><i data-i="moon"></i></button>
        </div>
        <span>New here?</span>
        <a class="btn btn--glass" href="signup.html">Create an account</a>
      </div>

      <form class="auth__form rise" action="dashboard.html">
        <div>
          <span class="eyebrow eyebrow--accent">Welcome back</span>
          <h1 class="display" style="margin-top:12px">Log in to your <em>studio.</em></h1>
        </div>
        <p class="lede">Your designs are waiting in this browser.</p>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap"><i data-i="mail"></i><input class="input" id="email" type="email" value="sujoncep@gmail.com" autocomplete="email"></div>
        </div>
        <div class="field">
          <div class="field__label"><label for="pw">Password</label><a class="link" href="forgot-password.html" style="font-size:var(--fs-xs)">Forgot password?</a></div>
          <div class="input-wrap"><i data-i="lock"></i><input class="input is-focus" id="pw" type="password" value="xxxxxxxxxx" autocomplete="current-password"><button class="input-wrap__end btn btn--sm btn--quiet btn--icon" type="button" aria-label="Show password"><i data-i="eye"></i></button></div>
        </div>

        <div class="turnstile"><span class="turnstile__box"><i data-i="check"></i></span>Success!<span class="turnstile__brand">CLOUDFLARE<br>Privacy · Terms</span></div>

        <a class="btn btn--primary btn--lg btn--block" href="dashboard.html">Log in <i data-i="arrow-right"></i></a>

        <div class="auth__row">
          <label class="check"><input type="checkbox" checked> Keep me signed in on this device</label>
        </div>
        <p class="auth__alt">Just looking? <a class="link" href="dashboard.html">Open the demo account</a></p>
      </form>

      <p class="auth__legal">© 2026 Cardstock · <a class="link" href="https://www.xahabcse.me/">xahabcse.me</a></p>
    </section>
  </div>
</body>
</html>
