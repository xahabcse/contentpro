<!doctype html>
<html lang="en" data-view="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password · Cardstock · mobile</title>
  <link rel="icon" href="../_shared/favicon.svg" type="image/svg+xml">
  <script src="../_shared/ui.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../_shared/tokens.css">
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <div class="tauth">
    <header class="tauth__top">
      <a class="logo" href="landing.html"><span class="logo__mark"></span>Cardstock</a>
      <div class="skyswitch glass" role="group" aria-label="Sky">
        <button type="button" data-sky-set="day" aria-label="Day"><i data-i="sun"></i></button>
        <button type="button" data-sky-set="night" aria-label="Night"><i data-i="moon"></i></button>
      </div>
      <a class="btn btn--glass" href="login.html"><i data-i="arrow-left"></i> Back to login</a>
    </header>

    <main class="tauth__card glass-strong">
      <div class="tauth__fan" aria-hidden="true">
        <div class="cp" data-card="release" data-pal="navy"></div>
        <div class="cp" data-card="tldr" data-pal="wine"></div>
        <div class="cp" data-card="progress" data-pal="cobalt"></div>
      </div>
      <form class="auth__form rise" action="login.html">
        <span class="auth__badge"><i data-i="lock"></i></span>
        <div>
          <span class="eyebrow eyebrow--accent">Reset password</span>
          <h1 class="display" style="margin-top:12px">Set a new <em>password.</em></h1>
        </div>
        <p class="lede">Choose something you have not used before. You will be signed out on every other device.</p>

        <div class="field">
          <label for="pw">New password</label>
          <div class="input-wrap"><i data-i="lock"></i><input class="input is-focus" id="pw" type="password" value="xxxxxxxxxxxxxx" autocomplete="new-password"><button class="input-wrap__end btn btn--sm btn--quiet btn--icon" type="button" aria-label="Show password"><i data-i="eye"></i></button></div>
          <div class="meter" aria-hidden="true"><i class="is-on"></i><i class="is-on"></i><i class="is-on"></i><i class="is-on"></i></div>
          <span class="hint hint--ok">Strong · 14 characters</span>
        </div>

        <a class="btn btn--primary btn--lg btn--block" href="login.html">Update password <i data-i="arrow-right"></i></a>

        <div class="notice glass"><i data-i="clock"></i><span>This link expires at <b>10:42</b>. Need a new one? <a class="link" href="forgot-password.html">Send it again</a></span></div>
      </form>
    </main>

    <p class="tauth__legal">© 2026 Cardstock · <a class="link" href="https://www.xahabcse.me/">xahabcse.me</a></p>
  </div>
</body>
</html>
