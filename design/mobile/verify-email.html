<!doctype html>
<html lang="en" data-view="mobile">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email · Cardstock · mobile</title>
  <link rel="icon" href="../_shared/favicon.svg" type="image/svg+xml">
  <script src="../_shared/ui.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../_shared/tokens.css">
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <div class="tauth">
    <header class="tauth__top">
      <a class="logo" href="landing.html"><span class="logo__mark"></span>Cardstock</a>
      <div class="skyswitch glass" role="group" aria-label="Sky">
        <button type="button" data-sky-set="day" aria-label="Day"><i data-i="sun"></i></button>
        <button type="button" data-sky-set="night" aria-label="Night"><i data-i="moon"></i></button>
      </div>
      <a class="btn btn--glass" href="login.html"><i data-i="arrow-left"></i> Back to login</a>
    </header>

    <main class="tauth__card glass-strong">
      <div class="tauth__fan" aria-hidden="true">
        <div class="cp" data-card="announce" data-pal="paper"></div>
        <div class="cp" data-card="cover" data-pal="ink"></div>
        <div class="cp" data-card="hiring" data-pal="charcoal"></div>
      </div>
      <div class="auth__form rise">
        <span class="auth__badge"><i data-i="mail"></i></span>
        <div>
          <span class="eyebrow eyebrow--accent">One more step</span>
          <h1 class="display" style="margin-top:12px">Check your <em>email.</em></h1>
        </div>
    </main>

    <p class="tauth__legal">© 2026 Cardstock · <a class="link" href="https://www.xahabcse.me/">xahabcse.me</a></p>
  </div>
</body>
</html>
