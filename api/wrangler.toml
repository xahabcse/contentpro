name = "contentpro-api"
main = "src/index.ts"
compatibility_date = "2025-03-20"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
# These are the deployed (production) defaults used by `wrangler deploy`.
# For local `wrangler dev`, override via `.dev.vars` or `--var` flags rather
# than editing these -- see .dev.vars.example.
ENV = "production"
FRONTEND_URL = "https://content.xahabcse.me"
RESEND_FROM_EMAIL = "ContentPro <noreply@xahabcse.me>"

# Cloudinary storage (spec section 5.6, revised) -- profile photos, company
# logos, and every exported PNG/PDF. Cloud name + API key are not secret
# (same as protfolio's wrangler.toml); the API secret is set via:
#   npx wrangler secret put CLOUDINARY_API_SECRET
CLOUDINARY_CLOUD_NAME = "drwezeylt"
CLOUDINARY_API_KEY = "115224732881292"

# KV namespace binding -- resend-verification / forgot-password rate-limit
# tracking (spec sections 5.3/5.4).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "85a0e6dd9be04224a6bb088f6a16667c"

# -----------------------------------------------------------------------------
# Workers Route -- the frontend (app/) calls the API via relative /api/*
# paths (e.g. fetch('/api/profile')), which only resolve correctly once this
# Worker is bound to handle that path prefix on the same custom domain the
# Pages project serves everything else from. Declaring this via [[routes]]
# makes every `wrangler deploy` (including CI) call the zone-scoped Workers
# Routes API to sync it -- which fails outright if the deploying token only
# has Account-level permissions (no Zone access), breaking deploys entirely.
# Left as a one-time MANUAL step instead (same tradeoff as the R2 bucket
# below): create it once via the dashboard --
#   Workers & Pages -> contentpro-api -> Settings -> Domains & Routes -> Add route
#   Route: content.xahabcse.me/api/*   Zone: xahabcse.me
# -- and it persists independently of this file; wrangler won't touch a route
# it was never told to manage.
# -----------------------------------------------------------------------------
# [[routes]]
# pattern = "content.xahabcse.me/api/*"
# zone_name = "xahabcse.me"

# -----------------------------------------------------------------------------
# Durable Object binding + migration -- wraps the single warm MongoClient
# connection (spec section 4.2). Durable Object class migrations are
# one-directional -- do not remove or rename an already-applied `new_classes`
# entry in production.
# -----------------------------------------------------------------------------
[durable_objects]
bindings = [
  { name = "MONGO_DO", class_name = "MongoConnectionDO" }
]

[[migrations]]
tag = "v1"
# Free-plan Durable Objects require SQLite-backed storage as of the current
# Workers platform requirements -- `new_classes` (KV-backed DO storage) is
# gated to paid plans. MongoConnectionDO doesn't use `this.ctx.storage` for
# anything (it only caches an in-memory MongoClient), so this is purely a
# platform/deployment requirement, not a behavior change.
new_sqlite_classes = ["MongoConnectionDO"]

# -----------------------------------------------------------------------------
# Secrets -- NOT set in this file. Provision via `wrangler secret put <NAME>`
# (see .dev.vars.example for local-dev equivalents):
#   MONGODB_URI, JWT_SECRET, RESEND_API_KEY, TURNSTILE_SECRET_KEY
# -----------------------------------------------------------------------------
