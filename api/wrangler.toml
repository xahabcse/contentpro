name = "contentpro-api"
main = "src/index.ts"
compatibility_date = "2025-03-20"
compatibility_flags = ["nodejs_compat_v2"]

[vars]
# These are the deployed (production) defaults used by `wrangler deploy`.
# For local `wrangler dev`, override via `.dev.vars` or `--var` flags rather
# than editing these -- see .dev.vars.example.
ENV = "production"
FRONTEND_URL = "https://content.xahabcse.me"
RESEND_FROM_EMAIL = "Cardstock <noreply@xahabcse.me>"

# Admin allowlist (comma-separated). Not a credential -- access still requires
# logging in as one of these accounts; this just flags which sessions may reach
# the /api/admin/* routes.
ADMIN_EMAILS = "sujoncep@gmail.com"

# KV namespace binding -- resend-verification / forgot-password rate-limit
# tracking (spec sections 5.3/5.4).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "85a0e6dd9be04224a6bb088f6a16667c"

# -----------------------------------------------------------------------------
# R2 -- profile photos and company logos (spec section 5.6). The bucket stays
# PRIVATE: every read goes through the ownership-checked /api/profile/{photo,logo}
# route, which streams the object body back through the Worker. `wrangler dev`
# emulates this locally with no credentials, same as D1.
# -----------------------------------------------------------------------------
[[r2_buckets]]
binding = "PROFILE_IMAGES"
bucket_name = "contentpro-profile-images"

# -----------------------------------------------------------------------------
# D1 -- the primary datastore (users + auth_events). Schema lives in
# api/migrations/*.sql and is applied with `wrangler d1 migrations apply`.
# api/seed.sql is a LOCAL-ONLY demo fixture and is deliberately NOT a migration
# -- apply it only via `wrangler d1 execute contentpro-db --local --file=./seed.sql`.
# -----------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "contentpro-db"
database_id = "fb2fe8f2-b144-41d9-aceb-497bdedbcbf3"

# -----------------------------------------------------------------------------
# Workers Route -- the frontend (app/) calls the API via relative /api/*
# paths (e.g. fetch('/api/profile')), which only resolve correctly once this
# Worker is bound to handle that path prefix on the same custom domain the
# Pages project serves everything else from. Declaring this via [[routes]]
# makes every `wrangler deploy` (including CI) call the zone-scoped Workers
# Routes API to sync it -- which fails outright if the deploying token only
# has Account-level permissions (no Zone access), breaking deploys entirely.
# Left as a one-time MANUAL step instead (same tradeoff as the R2 bucket
# below): create it once via the dashboard --
#   Workers & Pages -> contentpro-api -> Settings -> Domains & Routes -> Add route
#   Route: content.xahabcse.me/api/*   Zone: xahabcse.me
# -- and it persists independently of this file; wrangler won't touch a route
# it was never told to manage.
# -----------------------------------------------------------------------------
# [[routes]]
# pattern = "content.xahabcse.me/api/*"
# zone_name = "xahabcse.me"

# -----------------------------------------------------------------------------
# Durable Object binding + migrations -- a single global instance backs the
# ATOMIC auth throttles (login / signup / reset-password). DO storage is used
# because its get-then-put is serialized per instance, which KV cannot provide
# and brute-force defense actually requires. Durable Object class migrations
# are one-directional -- never remove or edit an already-applied entry; append
# a new tag instead.
# -----------------------------------------------------------------------------
[durable_objects]
bindings = [
  { name = "RATE_LIMIT_DO", class_name = "RateLimitDO" }
]

[[migrations]]
tag = "v1"
# Free-plan Durable Objects require SQLite-backed storage as of the current
# Workers platform requirements -- `new_classes` (KV-backed DO storage) is
# gated to paid plans.
new_sqlite_classes = ["MongoConnectionDO"]

[[migrations]]
tag = "v2"
# Mongo retired in favour of D1; the class kept only its rate-limiting half and
# was renamed accordingly. `renamed_classes` (not a new/delete pair) preserves
# the existing instance's storage -- the live `rl:` throttle counters -- across
# the rename.
renamed_classes = [{ from = "MongoConnectionDO", to = "RateLimitDO" }]

# -----------------------------------------------------------------------------
# Secrets -- NOT set in this file. Provision via `wrangler secret put <NAME>`
# (see .dev.vars.example for local-dev equivalents):
#   JWT_SECRET, RESEND_API_KEY, TURNSTILE_SECRET_KEY
# -----------------------------------------------------------------------------
