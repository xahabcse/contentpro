# ContentPro — full local stack. `docker compose up` gives you the app at
# http://localhost:8080 with a seeded demo account (demo@contentpro.local /
# demo1234). No Cloudflare account, MongoDB Atlas, Resend, or Cloudinary needed.
#
# Optional external services (email verification, image uploads) activate only
# if you supply real keys in a .env file — see .env.example.
name: contentpro

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: contentpro
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/contentpro
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-ContentPro <onboarding@resend.dev>}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      FRONTEND_URL: http://localhost:8080
    expose:
      - "8787"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  mongo-data:
