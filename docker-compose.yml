# ContentPro — full local stack. `docker compose up` gives you the app at
# http://localhost:8080 with a seeded demo account (demo@contentpro.local /
# demo1234). No Cloudflare account or Resend needed — the database is Cloudflare
# D1 and profile-image storage is Cloudflare R2, both of which `wrangler dev`
# emulates locally, so there is no database or storage service to run here.
#
# Turnstile's test widget still calls Cloudflare for login and signup, so those
# flows need internet access. Email delivery activates only if you supply a
# real Resend key in a .env file — see .env.example.
name: contentpro

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    volumes:
      # Persists wrangler's local state — including the emulated D1 SQLite file
      # — across `docker compose up`/`down`, so accounts created locally survive
      # a restart. Wipe it with `docker compose down -v`.
      - wrangler-state:/app/.wrangler
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-ContentPro <onboarding@resend.dev>}
      FRONTEND_URL: http://localhost:8080
    expose:
      - "8787"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  wrangler-state:
